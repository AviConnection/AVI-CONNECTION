<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worksvi | AVI CONNECTION</title><link rel="icon" type="image/png" href="assets/imagenes/favicon.png"><style>
:root{--light:#E6FAFD;--cyan:#4CC9F0;--blue:#1F7AE0;--navy:#1B2A4A;--dark:#0E1626; color-scheme:light; font-family:Inter,"Segoe UI",Arial,sans-serif;}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#faf8f3;color:#293b31} .scene{position:fixed;inset:0;display:grid;place-items:center;isolation:isolate;background:radial-gradient(ellipse at 50% 50%,#fffdf8 0%,#faf8f3 50%,#e6ecdf 100%);animation:exit .6s 4.6s both} .scene::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#77957e09 1px,transparent 1px),linear-gradient(90deg,#77957e09 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse,#000 0%,transparent 72%);z-index:-1} .center{display:flex;flex-direction:column;align-items:center;gap:30px;width:100%;padding:20px}.brand{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,32px);position:relative;min-height:100px}.symbol{display:flex;flex-direction:column;gap:4px;width:clamp(74px,15vw,126px);transform:translateX(calc((clamp(150px,27vw,260px) + clamp(12px,3vw,32px)) / 2));animation:shift .85s 1.85s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 15px #77957e15)}.task{display:flex;align-items:center;gap:0;width:100%;height:auto;--delay:.25s}.task:nth-child(2){--delay:.72s}.task:nth-child(3){--delay:1.19s}.task img{display:block;height:auto;min-width:0;object-fit:contain}.dot{width:27%;animation:dot .46s var(--delay) both}.bar{width:73%;transform-origin:left center;animation:bar .62s calc(var(--delay) + .12s) both}.word{font-size:clamp(36px,7vw,76px);font-weight:750;letter-spacing:-.065em;white-space:nowrap;line-height:1;display:flex;gap:0;width:clamp(150px,27vw,260px);font-family:"Segoe UI",Arial,sans-serif}.word span{display:inline-block;animation:letter .55s calc(2.05s + var(--i)*.075s) both}.word .last{background:linear-gradient(to bottom,var(--cyan) 0 31%,#293b31 31% 100%);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}.spark{position:absolute;width:4px;height:4px;background:#b86b50;border-radius:50%;opacity:0;box-shadow:0 0 12px #b86b50;animation:spark 2.4s var(--d) both;left:var(--x);top:var(--y)}.replay{display:none;position:fixed;inset:0;place-items:center;color:#e6fafd;text-align:center}.replay button{font:inherit;border:1px solid #4cc9f066;border-radius:10px;background:#1b2a4a;color:#e6fafd;padding:12px 20px;cursor:pointer}.done .replay{display:grid}.done .scene{display:none}@keyframes dot{from{opacity:0;transform:scale(.25) translateY(12px)}70%{opacity:1;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}@keyframes bar{from{opacity:0;transform:scaleX(.03)}to{opacity:1;transform:scaleX(1)}}@keyframes shift{to{transform:translateX(0)}}@keyframes letter{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes spark{0%,100%{opacity:0;transform:translateY(14px)}40%{opacity:.65}70%{opacity:.25;transform:translateY(-12px)}}@keyframes exit{from{opacity:1}to{opacity:0}}@media(prefers-reduced-motion:reduce){.symbol{transform:none;animation:none}.task img,.word span,.tag,.credit,.spark{display:none}.scene{animation:none}}
</style></head><body><main class="scene" role="status" aria-label="Worksvi, iniciando plataforma"><i class="spark" style="--x:22%;--y:32%;--d:0.4s"></i><i class="spark" style="--x:72%;--y:28%;--d:1s"></i><i class="spark" style="--x:81%;--y:61%;--d:1.3s"></i><i class="spark" style="--x:29%;--y:70%;--d:1.5s"></i><i class="spark" style="--x:49%;--y:18%;--d:0.8s"></i><div class="center"><div class="brand" aria-hidden="true"><div class="symbol"><div class="task"><img class="dot" src="assets/imagenes/row-1-dot.png" alt=""><img class="bar" src="assets/imagenes/row-1-bar.png" alt=""></div><div class="task"><img class="dot" src="assets/imagenes/row-2-dot.png" alt=""><img class="bar" src="assets/imagenes/row-2-bar.png" alt=""></div><div class="task"><img class="dot" src="assets/imagenes/row-3-dot.png" alt=""><img class="bar" src="assets/imagenes/row-3-bar.png" alt=""></div></div><div class="word"><span style="--i:0">W</span><span style="--i:1">o</span><span style="--i:2">r</span><span style="--i:3">k</span><span style="--i:4">s</span><span style="--i:5">v</span><span style="--i:6" class="last">i</span></div></div></div></main><script>window.setTimeout(()=>{window.location.replace("worksvi.html");},5200);</script><noscript><meta http-equiv="refresh" content="5;url=worksvi.html"></noscript></body></html>
