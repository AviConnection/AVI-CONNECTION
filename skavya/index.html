<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf6ef">
<title>Skavya</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 210'%3E%3Cpath d='M12 73Q12 47 38 37L153 9Q185 1 185 34V112H12Z' fill='%23071F3D'/%3E%3Cpath d='M22 75Q23 58 45 54L159 30Q173 27 173 43V115H22Z' fill='%23F9ECD6'/%3E%3Crect x='12' y='58' width='190' height='124' rx='24' fill='%23800629'/%3E%3Cpath d='M26 65C-10 93 164 120 142 182' stroke='%23FFF0D9' stroke-width='7' fill='none'/%3E%3Crect x='148' y='98' width='59' height='40' rx='16' fill='%23E4B40C'/%3E%3Ccircle cx='167' cy='118' r='9' fill='%23071F3D'/%3E%3C/svg%3E">
<style>
:root { color-scheme: light; --background: #faf6ef; --navy: #071f3d; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body { background: var(--background); display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; overflow: hidden; }
main { width: min(92vw, 690px); }
svg { display: block; width: 100%; height: auto; overflow: hidden; }
/* Secuencia completa: 2.5 segundos. El símbolo y la tipografía se conservan. */
#back,#front { animation: wallet 2.5s both; transform-origin: 107px 182px; }
#navy { animation: navy 2.5s both; transform-origin: 100px 90px; }
#cream { animation: cream 2.5s both; transform-origin: 100px 90px; }
#clasp { animation: clasp 2.5s both; transform-origin: 202px 118px; }
#symbol { animation: slide 2.5s both; }
/* Cada letra tiene su propia entrada Mask Rise, escalonada 40 ms. */
#wordmark { visibility: hidden; }
.rise-letter { animation: mask-rise .175s cubic-bezier(.22,.8,.28,1) calc(2.125s + var(--letter-index) * .04s) both; }
@supports not (animation-delay: calc(2.125s + 1 * .04s)) {
  .rise-letter { animation-delay: 2.125s; }
}
@keyframes wallet {
  0% { opacity:0; transform:translateY(-300px) rotate(-8deg); }
  2% { opacity:1; }
  11% { transform:translateY(0) scale(1.12,.83) rotate(2deg); }
  15% { transform:translateY(-20px) scale(.94,1.08) rotate(-3deg); }
  19% { transform:translateY(0) scale(1.04,.95); }
  23%,100% { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes navy {
  0%,17% { opacity:0; transform:translateY(-270px) rotate(-15deg); }
  19% { opacity:1; }
  29% { transform:translateY(13px) rotate(3deg); }
  33% { transform:translateY(-9px) rotate(-2deg); }
  38%,100% { opacity:1; transform:translateY(0); }
}
@keyframes cream {
  0%,29% { opacity:0; transform:translateY(-270px) rotate(13deg); }
  31% { opacity:1; }
  41% { transform:translateY(12px) rotate(-3deg); }
  45% { transform:translateY(-8px) rotate(2deg); }
  49%,100% { opacity:1; transform:translateY(0); }
}
@keyframes clasp {
  0%,49% { opacity:0; transform:translateX(45px) scaleX(.15); }
  51% { opacity:1; transform:translateX(24px) scaleX(.4); }
  58% { transform:translateX(-3px) scaleX(1.15); }
  61% { transform:translateX(1px) scaleX(.94); }
  64%,100% { opacity:1; transform:translateX(0) scaleX(1); }
}
@keyframes slide {
  0%,64% { transform:translateX(0); }
  75% { transform:translateX(-133px); }
  80% { transform:translateX(-121px); }
  85%,100% { transform:translateX(-125px); }
}
/* Mask Rise individual: cada letra asciende desde debajo de la máscara fija. */
@keyframes mask-rise {
  from { transform: translateY(90px); }
  to { transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  #back,#front,#navy,#cream,#clasp,#symbol,.rise-letter { animation-duration: .001s; animation-delay: 0s; }
}
</style>
</head>
<body>
<!-- Preloader oficial: transición a la interfaz principal. -->
<main aria-label="Skavya">
<svg viewBox="0 0 460 270" role="img" aria-labelledby="logo-title" xmlns="http://www.w3.org/2000/svg">
<title id="logo-title">Skavya</title>
<defs><clipPath id="word-reveal" clipPathUnits="userSpaceOnUse"><rect x="203" y="92" width="257" height="88"/></clipPath></defs>
<g id="symbol">
  <g transform="translate(152 63) scale(.73)">
    <g id="back"><rect x="12" y="58" width="190" height="124" rx="24" fill="#65051f"/></g>
    <g id="navy"><path d="M12 73 Q12 47 38 37 L153 9 Q185 1 185 34 V112 H12Z" fill="#071F3D"/></g>
    <g id="cream"><path d="M22 75 Q23 58 45 54 L159 30 Q173 27 173 43 V115 H22Z" fill="#F9ECD6"/></g>
    <g id="front">
      <rect x="12" y="58" width="190" height="124" rx="24" fill="#800629"/>
      <path d="M26 65 C-10 93 164 120 142 182" stroke="#FFF0D9" stroke-width="7" fill="none"/>
    </g>
    <g id="clasp">
      <rect x="148" y="98" width="59" height="40" rx="16" fill="#E4B40C"/>
      <circle cx="167" cy="118" r="9" fill="#071F3D"/>
    </g>
  </g>
</g>
<g id="word-reveal-group" clip-path="url(#word-reveal)"><text id="wordmark" x="211" y="158" font-family="'Google Sans','Nunito Sans','Arial Rounded MT Bold',Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8" fill="#071F3D" stroke="#071F3D" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">Skavya</text></g>
</svg>
</main>
<script>
// Medimos la palabra original para conservar sus posiciones y su tipografía.
// Cada letra se anima en su propio grupo SVG, sin mover la máscara.
(function () {
  const original = document.getElementById('wordmark');
  const container = document.getElementById('word-reveal-group');
  const ns = 'http://www.w3.org/2000/svg';
  const letters = Array.from(original.textContent);
  const positions = letters.map((_, i) => original.getStartPositionOfChar(i));
  letters.forEach((letter, i) => {
    const group = document.createElementNS(ns, 'g');
    group.setAttribute('class', 'rise-letter');
    group.style.setProperty('--letter-index', i);
    const glyph = original.cloneNode(false);
    glyph.removeAttribute('id');
    glyph.setAttribute('x', positions[i].x);
    glyph.setAttribute('y', positions[i].y);
    glyph.textContent = letter;
    group.appendChild(glyph);
    container.appendChild(group);
  });
  // 2.5 s de animación + 1 s con el logotipo completo.
  setTimeout(() => location.replace('./skavya.html'), 3500);
})();
</script>
</body>
</html>
