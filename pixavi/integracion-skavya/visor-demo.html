<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skavya · visor de integración</title><style>body{font:16px system-ui;background:#f5f0e7;color:#174b3b;padding:32px;max-width:760px;margin:auto}section{background:white;padding:22px;border-radius:16px;margin:16px 0}button,a{font:inherit;padding:12px;margin:8px 0;color:#174b3b}article{background:#233a50;color:white;padding:22px;border-radius:16px;margin:12px 0}small{color:#666}</style><h1>Skavya · visor de integración local</h1><p>Este archivo prueba que Pixavi y otro módulo del mismo origen ven la misma lista de tarjetas ficticias. No es la aplicación Skavya real y no procesa ni solicita datos bancarios.</p><section><h2>Métodos de pago</h2><div id="cards"></div><button id="demo">Agregar tarjeta ficticia</button></section><a href="../pixavi.html#avipay/tarjetas">Abrir Avi Pay en Pixavi</a><script src="../core/state.js"></script><script src="../core/skavya.js"></script><script>async function render(){let cards=await SkavyaBridge.listCards();let root=document.getElementById('cards');root.replaceChildren();if(!Array.isArray(cards))cards=cards.items||[];if(!cards.length)root.textContent='No hay tarjetas.';for(let c of cards){let a=document.createElement('article');a.textContent=(c.brand||'Tarjeta')+' •••• '+c.last4+' · '+(c.demo?'FICTICIA':'Vinculada');let b=document.createElement('button');b.textContent='Retirar';b.onclick=async()=>{await SkavyaBridge.removeCard(c.id);render()};a.append(document.createElement('br'),b);root.append(a)}}document.getElementById('demo').onclick=()=>{if(!SkavyaBridge.connected){SkavyaBridge.addDemoCard();render()}};window.addEventListener('storage',e=>{if(e.key===SkavyaBridge.demoCardsKey)render()});render().catch(e=>document.getElementById('cards').textContent=e.message)</script></html>
